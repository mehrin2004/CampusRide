services:
  - type: web
    name: campusride
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://admin:campusride123@cluster0.be9ttwf.mongodb.net/campusride?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
