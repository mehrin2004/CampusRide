<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Dynamic Transit Route Ring (Motion Orbital) -->
  <path d="M 110 370 A 180 180 0 1 1 410 320" fill="none" stroke="url(#amberGrad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="600 40" opacity="0.3" />
  <path d="M 80 340 A 200 200 0 1 1 430 260" fill="none" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round" opacity="0.6" />

  <!-- Outer Map Location Pin Backdrop (Glowing Amber) -->
  <path d="M 330 110 C 270 110, 220 160, 220 220 C 220 290, 330 380, 330 380 C 330 380, 440 290, 440 220 C 440 160, 390 110, 330 110 Z" 
        fill="url(#amberGrad)" filter="url(#dropShadow)" />
  <!-- Pin Inner Dot -->
  <circle cx="330" cy="210" r="42" fill="#0f172a" />
  <circle cx="330" cy="210" r="20" fill="#fbbf24" />

  <!-- Modern Express Transit Bus -->
  <g filter="url(#dropShadow)">
    <!-- Main Bus Body -->
    <rect x="96" y="180" width="220" height="210" rx="40" fill="#f59e0b" stroke="#ffffff" stroke-width="4" />
    
    <!-- Top Bus Roof Curve -->
    <path d="M 120 180 L 292 180 C 310 180, 316 195, 316 205 L 96 205 C 96 195, 102 180, 120 180 Z" fill="#d97706" />

    <!-- Windshield Glass -->
    <rect x="116" y="210" width="180" height="70" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
    <!-- Windshield Reflection -->
    <path d="M 126 220 L 210 220 L 170 270 L 126 270 Z" fill="#ffffff" opacity="0.2" />

    <!-- Side Mirrors -->
    <rect x="74" y="225" width="18" height="34" rx="8" fill="#1e293b" />
    <rect x="320" y="225" width="18" height="34" rx="8" fill="#1e293b" />

    <!-- Front Grille / Bumper -->
    <rect x="116" y="300" width="180" height="50" rx="12" fill="#1e293b" />
    
    <!-- Grille Lines -->
    <line x1="156" y1="315" x2="256" y2="315" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="166" y1="327" x2="246" y2="327" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="176" y1="339" x2="236" y2="339" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Headlights -->
    <circle cx="140" cy="325" r="14" fill="#ffffff" filter="url(#glow)" />
    <circle cx="140" cy="325" r="9" fill="#fef08a" />
    
    <circle cx="272" cy="325" r="14" fill="#ffffff" filter="url(#glow)" />
    <circle cx="272" cy="325" r="9" fill="#fef08a" />

    <!-- Wheels (Bottom) -->
    <rect x="120" y="375" width="40" height="25" rx="8" fill="#0f172a" />
    <rect x="252" y="375" width="40" height="25" rx="8" fill="#0f172a" />
  </g>

  <!-- Speed Motion Lines at Bottom -->
  <path d="M 70 420 L 440 420" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 120 442 L 390 442" stroke="#475569" stroke-width="6" stroke-linecap="round" />
</svg>
